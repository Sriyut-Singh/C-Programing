
name: Compile C Programs

on:
  push:
    paths:
      - 'Basics/**/*.c'
      - 'Intermediate/**/*.c'
      - '.github/workflows/compile-c.yml'
  pull_request:
    paths:
      - 'Basics/**/*.c'
      - 'Intermediate/**/*.c'
      - '.github/workflows/compile-c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile C Programs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GCC version
        run: gcc --version

      - name: Compile all C programs
        shell: bash
        run: |
          mkdir -p /tmp/c-build

          passed=0
          failed=0

          while IFS= read -r -d '' file; do
            name=$(basename "$file" .c)
            output="/tmp/c-build/${name}_$passed"

            echo ""
            echo "Checking $file..."

            if gcc -std=c11 -Wall -Wextra -Wpedantic \
              "$file" -o "$output"; then
              echo "PASSED: $file"
              ((passed+=1))
            else
              echo "FAILED: $file"
              ((failed+=1))
            fi

          done < <(find Basics Intermediate -type f -name '*.c' -print0 2>/dev/null)

          echo ""
          echo "========== FINAL REPORT =========="
          echo "Passed: $passed"
          echo "Failed: $failed"

          if [ "$passed" -eq 0 ] || [ "$failed" -gt 0 ]; then
            exit 1
          fi
